[project]
name = "lama-inpainting"
version = "0.1.0"
description = "Resolution-robust Large Mask Inpainting with Fourier Convolutions"
readme = "README.md"
requires-python = ">=3.8,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Roman Suvorov"},
]
keywords = ["inpainting", "deep-learning", "computer-vision", "pytorch"]

dependencies = [
    "torch>=1.8.0",
    "torchvision>=0.9.0",
    "numpy>=1.19.0",
    "opencv-python>=4.5.0",
    "scikit-image>=0.17.0",
    "albumentations[imgaug]>=0.0",
    "hydra-core>=1.1.0",
    "pytorch-lightning>=1.2.9",
    "tabulate>=0.8.9",
    "kornia>=0.5.0",
    "webdataset>=0.1.48",
    "packaging>=20.0",
    "pandas>=1.1.0",
    "pyyaml>=5.4.0",
    "tqdm>=4.61.0",
    "easydict>=1.9",
    "scikit-learn>=0.24.0",
    "scipy>=1.5.0",
    "joblib>=1.0.0",
    "matplotlib>=3.3.0",
    "imgaug>=0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9.0",
]
yadisk = [
    "wldhx-yadisk-direct>=0.0.6",
]

[project.urls]
Homepage = "https://github.com/advimman/lama"
Repository = "https://github.com/advimman/lama"

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["saicinpainting"]

[tool.setuptools.package-data]
saicinpainting = ["**/*.yaml", "**/*.yml"]
